# Self-hosted Supabase + Next.js pre FizioFit
# Hetzner VPS — jedna služba, všetko v EÚ

services:
  # === DATABÁZA ===
  db:
    image: supabase/postgres:15.8.1.085
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/99-schema.sql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fiziofit
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === SUPABASE AUTH ===
  auth:
    image: supabase/gotrue:v2.189.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_API_EXTERNAL_URL: http://62.238.118.51:9999
      API_EXTERNAL_URL: http://62.238.118.51:9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/fiziofit
      GOTRUE_SITE_URL: http://62.238.118.51:3099
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_LOG_LEVEL: info
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "false"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 86400
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/callback
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/callback
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/callback
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "Potvrdenie registrácie — FizioFit"
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: |
        <h2>Vitajte vo FizioFit!</h2>
        <p>Kliknite pre potvrdenie emailu:</p>
        <a href="{{ .ConfirmationURL }}">Potvrdiť email</a>
    ports:
      - "9999:9999"

  # === SUPABASE REST API (PostgREST) ===
  rest:
    image: postgrest/postgrest:v12.2.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/fiziofit
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_AGGREGATES_ENABLED: "true"
    ports:
      - "3001:3000"

  # === SUPABASE STUDIO (admin panel, len interne) ===
  studio:
    image: supabase/studio:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      SUPABASE_URL: http://rest:3000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_KEY}
    ports:
      - "3002:3000"

  # === PG META (pre Studio) ===
  meta:
    image: supabase/postgres-meta:v0.84.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/fiziofit
      PG_META_JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8081:8080"

  # === REALTIME (websocket pre live updaty) ===
  realtime:
    image: supabase/realtime:v2.29.9
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: fiziofit
      JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: dc51a2493a1329bfe570933fa23e8adb8c22a6b63445d2b9e23a11774d017325
      REPLICATION_MODE: RLS
      RLIMIT_NOFILE: "1024"
    ports:
      - "4000:4000"

  # === STORAGE (súbory, fotky, PDF) ===
  storage:
    image: supabase/storage-api:v1.11.6
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_KEY}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/fiziofit
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: default
      REGION: eu-central
      GLOBAL_S3_BUCKET: fiziofit
    volumes:
      - storage-data:/var/lib/storage
    ports:
      - "5000:5000"

  # === NEXT.JS APP ===
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: http://rest:3000
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
        NEXT_PUBLIC_SITE_URL: http://62.238.118.51:3099
    restart: unless-stopped
    depends_on:
      - auth
      - rest
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SUPABASE_URL: http://rest:3000
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_KEY}
      NEXT_PUBLIC_SITE_URL: http://62.238.118.51:3099
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3099:3000"

volumes:
  pgdata:
  storage-data: